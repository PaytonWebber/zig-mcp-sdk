name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Node 24 becomes the forced default on 2026-06-16; opt in now so
      # breakage surfaces here instead of on the flip date.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Tests, format check, compile examples
        run: zig build check

      - name: Install example binaries
        run: zig build examples

      - name: MCP conformance check
        run: ./scripts/conformance.sh
